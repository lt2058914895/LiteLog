    <h2>常见问题</h2>
    <p><strong>数据保存在哪里？</strong><br>当前版本的数据和头像仅保存在设备上的 App 沙盒中，不会上传到服务器。</p>
    <p><strong>如何备份和恢复？</strong><br>在设置页导出 JSON 备份，再通过“从备份恢复”导入。恢复会替换当前资料和记录。</p>
    <p><strong>如何删除数据？</strong><br>可以在记录页删除单条记录，在个人资料页移除头像。卸载 App 会删除本地沙盒数据。</p>
    <p><strong>是否支持记录照片？</strong><br>当前版本不支持记录照片，头像仍可在本地更换。</p>
